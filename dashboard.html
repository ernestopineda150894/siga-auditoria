<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIGA — Dashboard de prueba</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#f5f8fb;color:#17324d}
header{height:68px;background:#fff;border-bottom:1px solid #e3ebf1;display:flex;align-items:center;justify-content:space-between;padding:0 28px}
.logo{font-weight:800;color:#0d5275;letter-spacing:2px}.user{font-size:13px;color:#5d7181}
main{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 68px)}
aside{background:#0b2f55;color:#fff;padding:24px 16px}aside h3{margin:0 10px 25px;font-size:18px}nav a{display:block;color:#dce9f2;text-decoration:none;padding:12px 10px;border-radius:7px;font-size:14px;margin-bottom:4px}nav a.active,nav a:hover{background:#14577b;color:#fff}
.content{padding:35px}.content h1{margin-top:0}.cards{display:grid;grid-template-columns:repeat(3,minmax(150px,1fr));gap:18px}.stat{background:#fff;border:1px solid #e3ebf1;border-radius:12px;padding:22px;box-shadow:0 8px 25px #0c2a4510}.stat span{font-size:12px;color:#718292}.stat b{display:block;font-size:30px;margin-top:8px;color:#0b5275}.activity{margin-top:25px;background:#fff;border:1px solid #e3ebf1;border-radius:12px;padding:24px}.logout{margin-top:25px;border:0;background:#fff;color:#a33;padding:10px;cursor:pointer}
@media(max-width:700px){main{grid-template-columns:1fr}aside{display:none}.cards{grid-template-columns:1fr}.content{padding:20px}}
</style>
</head>
<body>
<header><div class="logo">SIGA</div><div class="user">Usuario: <strong>admin</strong></div></header>
<main>
<aside><h3>SIGA</h3><nav><a class="active">🏠 Dashboard</a><a>👥 Usuarios</a><a>🏢 Firmas</a><a>📁 Clientes</a><a>📋 Auditorías</a><a>⚙ Configuración</a></nav><button class="logout" onclick="location.href='index.html'">Cerrar sesión</button></aside>
<section class="content">
<h1>Buenos días, Administrador</h1><p>Resumen general del sistema</p>
<div class="cards"><div class="stat"><span>Usuarios</span><b>25</b></div><div class="stat"><span>Auditorías</span><b>18</b></div><div class="stat"><span>Clientes</span><b>12</b></div></div>
<div class="activity"><h3>Actividad reciente</h3><p>• Usuario creado</p><p>• Auditoría asignada</p><p>• Contraseña actualizada</p></div>
</section>
</main>
</body>
</html>
