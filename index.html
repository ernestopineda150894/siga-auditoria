<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIGA | Acceso</title>
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <main class="login-page">
    <section class="brand-panel">
      <div class="brand-content">
        <div class="siga-title">SIGA</div>
        <div class="siga-subtitle">Sistema Integral de<br>Gestión de Auditorías</div>
        <div class="brand-divider"></div>
        <div class="asset-placeholder">LOGO FIRMA LOCAL</div>
        <div class="member-text">a member of</div>
        <div class="asset-placeholder international">LOGO INTERNACIONAL</div>
      </div>
    </section>

    <section class="login-panel">
      <div class="login-card">
        <h1>Bienvenido</h1>
        <p class="welcome">Ingresa tus credenciales para continuar</p>

        <form id="loginForm">
          <label for="username">Usuario</label>
          <div class="input-wrap">
            <span>⌑</span>
            <input id="username" name="username" type="text" autocomplete="username" required>
          </div>

          <label for="password">Contraseña</label>
          <div class="input-wrap">
            <span>●</span>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button class="show-password" type="button" id="togglePassword" aria-label="Mostrar contraseña">◉</button>
          </div>

          <div class="options">
            <label class="remember"><input type="checkbox"> <span>Recordarme</span></label>
            <a href="#" onclick="return false;">¿Olvidó su contraseña?</a>
          </div>

          <button class="login-button" type="submit">Iniciar Sesión</button>
          <div id="message" class="message" aria-live="polite"></div>
        </form>
      </div>
    </section>

    <footer>© 2026 SIGA — Sistema Integral de Gestión de Auditorías</footer>
  </main>
  <script src="src/app.js"></script>
</body>
</html>
